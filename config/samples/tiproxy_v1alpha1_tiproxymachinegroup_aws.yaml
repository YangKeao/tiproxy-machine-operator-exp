apiVersion: tiproxy.pingcap.com/v1alpha1
kind: TiProxyMachineGroup
metadata:
  name: demo-aws
  namespace: default
spec:
  provider: aws
  replicas: 2
  portRange:
    start: 6000
    end: 6099
  exposure:
    loadBalancers:
    - name: internal
      scope: internal
    # - name: public
    #   scope: external
    #   subnetIDs:
    #   - subnet-public-aaaaaaaa
    #   - subnet-public-bbbbbbbb
  placement:
    region: us-west-2
    # failureDomains:
    # - us-west-2a
    # - us-west-2b
    # spreadPolicy: Balanced
  machine:
    image: ami-xxxxxxxxxxxxxxxxx
    class: t3.large
    identityRef: tiproxy-machine-agent-role
  # scaling:
  #   minReplicas: 2
  #   maxReplicas: 4
  # resourceNames:
  #   group: demo-aws-asg
  #   machineTemplate: demo-aws-lt
  # tags:
  #   env: demo
  network:
    subnetIDs:
    - subnet-aaaaaaaa
    - subnet-bbbbbbbb
    securityGroupIDs:
    - sg-cccccccc
  bootstrap:
    kubeconfig:
      path: /etc/tiproxy-machine-agent/kubeconfig
      remoteRef:
        backend: parameterStore
        identifier: /tiproxy/demo/kubeconfig
  tiproxy:
    baseImage: pingcap/tiproxy
    version: latest
    apiPort: 3080
