apiVersion: tiproxy.pingcap.com/v1alpha1
kind: TiDBInstanceLink
metadata:
  name: demo-link
  namespace: default
spec:
  machineGroupRef:
    name: demo
  clusterName: demo-cluster
  # Optional: pin this link to a fixed frontend port.
  port: 6001
  routeNamespace: demo
  frontendUser: demo_user
  pdAddresses:
  - 10.0.0.10:2379
  - 10.0.0.11:2379
  nsServerAddress: 10.0.0.20:3930
