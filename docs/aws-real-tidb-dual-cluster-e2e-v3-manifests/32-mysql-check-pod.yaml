apiVersion: v1
kind: Pod
metadata:
  name: mysql-check
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: mysql
    image: mysql:8
    command:
    - sh
    - -c
    - |
      set -eux
      mysql -h ${TIPROXY_FRONTEND} -P 6001 -utiproxy_test -pTiproxy#Pass123 -Nse "SELECT val FROM routecheck.marker"
      mysql -h ${TIPROXY_FRONTEND} -P 6002 -utiproxy_test -pTiproxy#Pass123 -Nse "SELECT val FROM routecheck.marker"
