apiVersion: v1
kind: Service
metadata:
  name: coredns-health
  namespace: kube-system
spec:
  type: NodePort
  selector:
    k8s-app: kube-dns
  ports:
  - name: dns-tcp-health
    protocol: TCP
    port: 53
    targetPort: 53
    nodePort: 32053
---
apiVersion: v1
kind: Service
metadata:
  name: coredns-nlb
  namespace: kube-system
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: TCP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "32053"
spec:
  type: LoadBalancer
  selector:
    k8s-app: kube-dns
  ports:
  - name: dns-udp
    protocol: UDP
    port: 53
    targetPort: 53
