apiVersion: v1
kind: ServiceAccount
metadata:
  name: tiproxy-manager
  namespace: tiproxy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tiproxy-manager-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: tiproxy-manager
  namespace: tiproxy-system
